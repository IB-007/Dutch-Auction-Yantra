<!DOCTYPE html>
<html>
<head>
    <title>NFT Auction</title>
    <style>
        body {
            background:#0f0f0f;
            color:white;
            text-align:center;
            font-family:sans-serif;
            padding-top:100px;
        }
        button {
            padding:15px 30px;
            font-size:18px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }
    </style>
</head>
<body>

<h1>🔥 Live NFT Auction</h1>
<p id="status">Status: Not connected</p>

<button onclick="connectWallet()">Connect Wallet</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<script>
const ADDRESS = "0xdca7449f891f6adc4782771c2baafbb84cd91dcc";

const ABI = [
    "function administrator() public view returns (address)"
];

async function connectWallet() {
    if (!window.ethereum) return alert("Install MetaMask");

    const provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    const signer = provider.getSigner();
    const userAddress = await signer.getAddress();

    const contract = new ethers.Contract(ADDRESS, ABI, signer);
    const admin = await contract.administrator();

    document.getElementById("status").innerText =
        "Connected: " + userAddress;

    if (admin.toLowerCase() === userAddress.toLowerCase()) {
        window.location.href = "admin.html";
    } else {
        window.location.href = "participant.html";
    }
}
</script>

</body>
</html>
